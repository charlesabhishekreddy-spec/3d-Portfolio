# Render blueprint — https://render.com/docs/blueprint-spec
#
# DEPLOY: push the branch, then in Render choose New → Blueprint and point it
# at this repository. Render reads this file and creates the service for you.
#
# ⚠️  THE BRANCH MATTERS. This repository's default branch (`main`) contains
#     only a README — the app lives on the branch named below. If Render builds
#     `main` instead, the build fails with:
#       npm error enoent Could not read package.json
#     Fix it in the dashboard: Settings → Build & Deploy → Branch → pick the
#     branch below → Save. Nothing in the code is wrong.
#
# This is the FREE configuration. It uses no disk, which is only safe because
# content and images are stored in the GitHub repository (see storage.js) rather
# than on local disk. Free services sleep after 15 idle minutes and take roughly
# a minute to wake on the next visit.
services:
  - type: web
    name: charles-portfolio
    runtime: node
    plan: free
    region: singapore
    branch: arena/01a0e32e-3d-portfolio
    # --include=dev is required: NODE_ENV=production below makes npm ci skip
    # devDependencies, which removes the vite binary and fails the build with
    # "sh: 1: vite: not found". Build-time tools must be installed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # ── Your private studio password. Set this in the Render dashboard.
      - key: ADMIN_PASSWORD
        sync: false
      # ── GitHub-backed storage (replaces the disk).
      # Create a fine-grained token: repo → 3d-Portfolio → Contents: Read and
      # write. No other permissions. Paste it into the dashboard when prompted.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: charlesabhishekreddy-spec/3d-Portfolio
      - key: GITHUB_BRANCH
        value: arena/01a0e32e-3d-portfolio
      # Local disk is a cache only; nothing important is stored here.
      - key: DATA_DIR
        value: /tmp/portfolio-data
      - key: UPLOAD_DIR
        value: /tmp/portfolio-uploads
