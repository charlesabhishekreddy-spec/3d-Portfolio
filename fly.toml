# Fly.io config — https://fly.io/docs/reference/configuration/
#
# Deploy:  fly launch --no-deploy
#          fly secrets set ADMIN_PASSWORD='YOUR-PASSWORD-HERE' \
#                       GITHUB_TOKEN='YOUR-TOKEN' \
#                       GITHUB_REPO='charlesabhishekreddy-spec/3d-Portfolio' \
#                       GITHUB_BRANCH='arena/01a0e32e-3d-portfolio'
#          fly deploy
#
# This is the free configuration. Content and images are stored in the GitHub
# repository (see storage.js), so no volume is needed and Fly's $5 trial credit
# covers light use. The volume below is optional; add it only if you would
# rather keep local files.
app = "charles-portfolio"
primary_region = "bom" # Mumbai — closest to you in India

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/tmp/portfolio-data"
  UPLOAD_DIR = "/tmp/portfolio-uploads"

# Optional persistent volume. Uncomment after `fly volumes create portfolio_data
# --size 1 --region bom` if you want local files kept as well.
# [[mounts]]
#   source = "portfolio_data"
#   destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # Port 80/443 are the only externally reachable ports.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
