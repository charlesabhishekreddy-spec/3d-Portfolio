# Fly.io config — https://fly.io/docs/reference/configuration/
#
# Deploy:  fly launch --no-deploy  →  fly volumes create portfolio_data --size 1
#          fly secrets set ADMIN_PASSWORD='your-password'
#          fly deploy
#
# A Fly volume is REQUIRED. Without it, admin edits and uploaded images are
# lost on every machine replacement. Volumes are billed per GB-month.
app = "charles-portfolio"
primary_region = "bom" # Mumbai — closest to you in India

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data/content"
  UPLOAD_DIR = "/data/uploads"

[[mounts]]
  source = "portfolio_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # Port 80/443 are the only externally reachable ports.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
